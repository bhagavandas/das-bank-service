spring.application.name=ledger-service
server.port=9082
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/ledger_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
jwt.secret=${JWT_SECRET:replace-this-with-a-random-secret-at-least-32-bytes-long}
management.endpoints.web.exposure.include=health,info
