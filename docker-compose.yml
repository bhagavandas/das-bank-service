services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports: ["3307:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  auth-service:
    build: ./auth-service
    ports: ["9081:9081"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-bytes-long}
    depends_on: {mysql: {condition: service_healthy}}

  ledger-service:
    build: ./ledger-service
    ports: ["9082:9082"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ledger_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-bytes-long}
    depends_on: {mysql: {condition: service_healthy}}

  fraud-service:
    build: ./fraud-service
    ports: ["9086:9086"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fraud_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    depends_on: {mysql: {condition: service_healthy}}

  transfer-service:
    build: ./transfer-service
    ports: ["9083:9083"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/transfer_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      LEDGER_SERVICE_URL: http://ledger-service:9082
      FRAUD_SERVICE_URL: http://fraud-service:9086
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_started}
      ledger-service: {condition: service_started}
      fraud-service: {condition: service_started}

  notification-service:
    build: ./notification-service
    ports: ["9084:9084"]
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on: {kafka: {condition: service_started}}

  beneficiary-service:
    build: ./beneficiary-service
    ports: ["9085:9085"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/beneficiary_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-bytes-long}
    depends_on: {mysql: {condition: service_healthy}}

  api-gateway:
    build: ./api-gateway
    ports: ["9080:9080"]
    environment:
      JWT_SECRET: ${JWT_SECRET:-replace-this-with-a-random-secret-at-least-32-bytes-long}
    depends_on: [auth-service, ledger-service, transfer-service, notification-service, beneficiary-service, fraud-service]

  frontend:
    build: ./frontend
    ports: ["3001:80"]
    depends_on: [api-gateway]

volumes:
  mysql_data:
