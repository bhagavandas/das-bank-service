spring.application.name=transfer-service
server.port=9083
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/transfer_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
ledger-service.url=${LEDGER_SERVICE_URL:http://localhost:9082}
fraud-service.url=${FRAUD_SERVICE_URL:http://localhost:9086}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
management.endpoints.web.exposure.include=health,info
